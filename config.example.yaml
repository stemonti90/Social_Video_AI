# AUT Video Pipeline — configuration.
# Copy to config.yaml and edit. Every key is optional; defaults are shown.

llm:
  host: http://localhost:11434
  model: gemma4:12b-mlx   # the ONE script model (Gemma 4, native Apple MLX) — optimized for quality
  best_of: 1              # 1 = one script refined in depth (quality); >1 generates N drafts (off by default)
  temperature: 0.7

script:
  target_seconds: 50      # aim above the 60s TikTok Creator-Rewards minimum
  language: en            # en | it — language of the spoken narration + captions

funnel:                   # appended as a spoken + on-screen endcard (objective #2: app installs)
  enabled: true
  app_name: AstroStackerPro
  tagline: Turn your phone into an astrophotography studio.
  url: https://www.astrostackerpro.com/
  handle: "@astrostackerpro"
  cta_line: "Want to capture the cosmos yourself? Get {app} — link in the bio."
  cta_button: "Get the app  ·  Link in bio"   # endcard pill label (set to your channel language)

tts:
  engine: kokoro          # kokoro (the only shipped engine — Apache-2.0, commercial-clean)
  kokoro_voice: af_heart  # see Kokoro voices (af_*, am_*, bf_*, bm_*); IT uses if_sara automatically
  kokoro_lang: a          # a = American English, b = British, i = Italian
  device: mps             # Apple Silicon GPU

stt:                      # for caption word-timing
  engine: parakeet        # parakeet (MLX, fast & clean) | whisperx (accurate) | even (no install)
  model: large-v3
  parakeet_model: mlx-community/parakeet-tdt-0.6b-v3

video:
  width: 1080
  height: 1920
  fps: 30
  music:                  # path to a royalty-free background track (optional)
  music_gain_db: -22.0    # how far the music sits under the voice
  ken_burns: true         # slow zoom on still images
  crf: 20                 # lower = higher quality / bigger file
  transition: 0.4         # crossfade seconds between clips (0 = hard cut)
  segment_gap: 0.22       # silence after each segment (pacing/breath)
  loudness_lufs: -14.0    # EBU R128 normalization target (0 = disable)
  prefer_video: true      # use NASA video clips when available, else stills + Ken Burns
  video_seek: 3.0         # skip N seconds into video clips (avoids NASA title cards)
  show_credits: true      # small source credit burned per clip
  # Visuals: archive = real NASA/Wikimedia footage (public domain / free licenses) ·
  # generate = local AI images (mflux z-image-turbo on MLX, best of N picked by CLIP), archives as
  # fallback. Setup for `generate`:
  #   python3.11 -m venv vendor/mflux-venv && vendor/mflux-venv/bin/pip install mflux
  #   vendor/mflux-venv/bin/mflux-save --model z-image-turbo -q 4 --path vendor/zimage-q4
  # ALWAYS pre-quantize: quantizing on the fly peaks ~28GB / ~12min per image on a 24GB Mac,
  # versus ~9.8GB / ~74s from the saved model. With `generate` the visuals are synthetic —
  # set publish.disclose_ai true (TikTok video_made_with_ai).
  footage_source: archive     # archive | generate
  image_venv: vendor/mflux-venv
  image_model: vendor/zimage-q4    # pre-quantized model dir
  image_candidates: 2         # per segment; CLIP keeps the best
  image_steps: 8              # z-image-turbo sweet spot
  image_width: 720            # 720x1280 ≈ 74s/image · 512x896 ≈ 25s
  image_height: 1280
  image_seed: 100
  image_timeout: 900

captions:
  font: Arial
  fontsize: 84
  primary_color: "&H00FFFFFF"    # ASS color = &HAABBGGRR  (white)
  highlight_color: "&H0000E5FF"  # amber
  outline: 4
  margin_v: 320           # distance from bottom
  group: 3                # words shown per caption line

publish:                  # share to socials via Postiz (open-source scheduler; TikTok/IG/YouTube + more)
  # Setup: run `deploy/postiz/setup.sh` (brings up Postiz via Docker), then in the UI at
  # http://localhost:4007 connect your TikTok/IG/YouTube channels and create an API key at Settings →
  # put it in postiz_token (or env AVP_POSTIZ_TOKEN). `avp publish <slug>` is a DRY RUN (writes
  # publish_plan.json); add --go to post, --at "2026-07-01T18:00:00Z" to schedule. Channel ids are
  # auto-discovered, so `integrations` can stay empty unless you want to pin a specific one.
  postiz_url: http://localhost:4007/api   # self-host public API base (NEXT_PUBLIC_BACKEND_URL)
  postiz_token: ""        # or set env AVP_POSTIZ_TOKEN
  platforms: [youtube, tiktok, instagram]
  voice: kokoro
  integrations: {}        # optional override: platform -> Postiz integration (channel) id
  privacy: public         # public | unlisted | private  (mapped per platform)
  made_for_kids: false    # YouTube "made for kids" self-declaration
  disclose_ai: false      # TikTok video_made_with_ai — footage is real; set true to disclose the AI voice/script
  short_link: false       # let Postiz shorten links in the caption

paths:
  projects_dir: projects
  footage_dir: assets/footage
  music_dir: assets/music

auto:                     # unattended daily pipeline: `avp auto` generates count videos + schedules them
  count: 3                # videos per run
  platforms: [tiktok, instagram]   # only those with a connected Postiz channel actually get posted
  post_times: ["12:00", "18:00", "21:00"]   # local HH:MM slots; tune to YOUR audience's best times
  timezone: Europe/Rome   # IANA tz the post_times are in
  queue_path: topics.txt  # topic queue (one per line); relative → under projects_dir
  refill_threshold: 6     # refill the queue when it holds fewer than this
  refill_batch: 12        # how many topics the LLM proposes per refill
  theme: space and astronomy   # editorial theme for LLM topic brainstorming
