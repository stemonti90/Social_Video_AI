# Smoke-test config: single fast voice, no model downloads for captions.
llm:
  host: http://localhost:11434
  model: qwen3:14b
  temperature: 0.7
script:
  target_seconds: 15
tts:
  engine: kokoro
  primary: kokoro
  kokoro_voice: af_heart
  kokoro_lang: a
  device: mps
stt:
  engine: even
video:
  width: 1080
  height: 1920
  fps: 30
  ken_burns: true
  crf: 20
captions:
  font: Arial
  fontsize: 84
  group: 3
paths:
  projects_dir: projects
  footage_dir: assets/footage
  music_dir: assets/music
